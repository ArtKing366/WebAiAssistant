<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AI English Assistant</title>

  <style>
    :root {
      --bg: #f0f2f5;
      --panel: #ffffff;
      --user: #2f6fed;
      --bot: #e8eaed;
      --text: #1a1a1a;
      --muted: #6b7280;
      --border: #d1d5db;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 12px;
    }

    .app {
      width: min(720px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      min-height: 80vh;
      overflow: hidden;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      margin: 0;
      font-size: 1.25rem;
    }

    .context-info {
      color: var(--muted);
      font-size: 0.8rem;
      text-align: right;
    }

    .context-info strong {
      color: var(--text);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: var(--user);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--bot);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .controls {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--border);
    }

    #input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    #send {
      background: var(--user);
      color: #fff;
    }

    #clear {
      background: #e5e7eb;
      color: var(--text);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .hint {
      padding: 0 16px 12px;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <h1>AI English Assistant</h1>

      <div class="context-info">
        Context left:
        <strong id="contextLeft">—</strong>
        <br />
        Used:
        <span id="contextUsed">—</span>
      </div>
    </div>

    <div id="chat"></div>

    <p class="hint">
      Write a word or a question — the assistant will translate it,
      explain it, and provide examples.
    </p>

    <div class="controls">

      <input
        id="input"
        type="text"
        placeholder="Enter your message..."
        autocomplete="off"
      />

      <button id="send" type="button">
        Send
      </button>

      <button id="clear" type="button">
        Clear
      </button>

    </div>

  </div>

  <script>

    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const clearBtn = document.getElementById("clear");

    const contextLeftEl =
      document.getElementById("contextLeft");

    const contextUsedEl =
      document.getElementById("contextUsed");


    function getSessionId() {

      let id = localStorage.getItem("session_id");

      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem("session_id", id);
      }

      return id;
    }


    function addMessage(role, text) {

      const div = document.createElement("div");

      div.className = `message ${role}`;

      div.textContent = text;

      chatEl.appendChild(div);

      chatEl.scrollTop = chatEl.scrollHeight;
    }


    function updateContext(context) {

      if (!context) {
        return;
      }

      contextLeftEl.textContent =
        context.left.toLocaleString();

      contextUsedEl.textContent =
        context.used.toLocaleString();
    }


    async function sendMessage() {

      const text = inputEl.value.trim();

      if (!text) {
        return;
      }

      inputEl.value = "";

      addMessage("user", text);

      sendBtn.disabled = true;

      try {

        const res = await fetch("/chat", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            session_id: getSessionId(),
            text,
          }),

        });


        if (!res.ok) {

          const err =
            await res.json().catch(() => ({}));

          throw new Error(
            err.detail || "Server error"
          );
        }


        const data = await res.json();


        addMessage(
          "assistant",
          data.reply
        );


        updateContext(
          data.context
        );


      } catch (err) {

        addMessage(
          "assistant",
          `Error: ${err.message}`
        );

      } finally {

        sendBtn.disabled = false;

        inputEl.focus();
      }
    }


    async function clearChat() {

      const sessionId =
        getSessionId();

      try {

        await fetch(
          `/chat/${sessionId}`,
          {
            method: "DELETE"
          }
        );

      } catch (_) {
        // Ignore network errors on clear
      }


      chatEl.innerHTML = "";

      contextLeftEl.textContent = "—";
      contextUsedEl.textContent = "—";

      inputEl.focus();
    }


    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    clearBtn.addEventListener(
      "click",
      clearChat
    );


    inputEl.addEventListener(
      "keydown",
      (e) => {

        if (e.key === "Enter") {
          sendMessage();
        }

      }
    );


    getSessionId();

    inputEl.focus();

  </script>

</body>

</html>
